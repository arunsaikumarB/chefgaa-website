[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CSP allows this site's assets, Google Fonts, Supabase, the drei studio
# HDRI (githack redirects to raw.githubusercontent.com), Sketchfab embeds,
# the Draco decoder on gstatic, and blob URLs from the 3D viewers.
# style-src keeps 'unsafe-inline' because the page sets inline styles.
# script-src keeps 'wasm-unsafe-eval' for the Draco and Meshopt decoders.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co https://raw.githack.com https://rawcdn.githack.com https://raw.githubusercontent.com https://www.gstatic.com; frame-src https://sketchfab.com https://www.sketchfab.com; worker-src 'self' blob:; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
